<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="icon" type="image/x-icon" href="Zicon/Favicon.png">
</head>
<body>

    <header class="top">
        <a class="back" href="photo.html"><i class="fa-solid fa-arrow-left"></i> All places</a>
        <nav class="places" id="places" aria-label="Switch place"></nav>
    </header>

    <main>
        <section class="intro">
            <h1 id="title">Gallery</h1>
            <p id="subtitle"></p>
        </section>

        <section class="grid" id="grid" aria-live="polite"></section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
        <button class="lb-btn lb-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <button class="lb-btn lb-prev" aria-label="Previous photo"><i class="fa-solid fa-chevron-left"></i></button>
        <figure>
            <img id="lb-img" alt="">
            <figcaption id="lb-cap"></figcaption>
        </figure>
        <button class="lb-btn lb-next" aria-label="Next photo"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <script src="places.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
