<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="photo.css?v=2">

<body>

    <div class="container">
        <!-- MAP BUTTON (delete this line to turn off) -->

        <div class="slide"></div>   <!-- filled by photo.js from places.js -->

        <div class="progress"><span></span></div>

        <div class="button">
            <button class="prev"><i class="fa-solid fa-arrow-left"></i> Previous</button>
            <button class="next">Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script src="places.js?v=2"></script>
    <script src="fade.js?v=2"></script>             <!-- PAGE TRANSITION (delete to turn off) -->
